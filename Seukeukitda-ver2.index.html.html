function empty(msg){return `<div class="empty">${msg}</div>`}
function recordCard(r){return `<article class="item"><div class="item-top"><div><div class="tag">${esc(r.grade)} · ${esc(r.semester)}</div><div class="tag">${esc(r.subject)}</div><div class="tag ${r.type==='평가기준표'?'green':''}">${esc(r.type)}</div><h3 style="margin-top:8px">${esc(r.title||r.fileName||'제목 없는 자료')}</h3><div class="tiny muted">${esc(r.fileName||'파일명 없음')} · ${new Date(r.createdAt).toLocaleDateString('ko-KR')}</div></div></div>${r.summary?`<p><b>분석 메모</b> · ${esc(r.summary)}</p>`:''}${r.notes?`<p>${esc(r.notes)}</p>`:''}<div class="item-actions"><button class="btn outline small" data-action="edit-record" data-id="${r.id}">제목·메모 수정</button><button class="btn outline small" data-action="download-record" data-id="${r.id}">파일 정보 보기</button><button class="btn danger small" data-action="delete-record" data-id="${r.id}">삭제</button></div></article>`}
function renderHome(){let profile=state.profile||{};let count=state.records.filter(r=>r.type==='수행평가 파일').length;let rubrics=state.records.filter(r=>r.type==='평가기준표').length;return `<div class="section-head"><div><h2>${esc(profile.name||'학생')}님의 학습 기록</h2><p>진로 관심사와 과거 탐구를 다음 수행평가의 출발점으로 연결합니다.</p></div><button class="btn outline small" data-action="profile">프로필 수정</button></div><div class="grid"><div class="card"><div class="muted tiny">저장한 수행평가 자료</div><div class="stat">${count}</div><div class="tiny muted">내가 해온 탐구의 기록</div></div><div class="card"><div class="muted tiny">저장한 평가 기준표</div><div class="stat">${rubrics}</div><div class="tiny muted">평가 조건을 놓치지 않도록</div></div><div class="card"><div class="muted tiny">관심 진로 선택</div><div class="stat">${(profile.goals||[]).length}/5</div><div class="tiny muted">분야·학과·직업을 함께 관리</div></div></div><div class="main-layout" style="margin-top:16px"><div><div class="section-head"><div><h2>최근 저장한 자료</h2><p>자료를 쌓을수록 연계 아이디어를 찾기 쉬워집니다.</p></div><button class="btn ghost small" data-go="archive">전체 보기</button></div>${state.records.length?state.records.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,3).map(recordCard).join(''):empty('아직 저장한 자료가 없습니다.<br>먼저 수행평가 파일이나 평가 기준표를 업로드해 보세요.')}<div class="section-head"><div><h2>바로 시작하기</h2><p>필요한 기능으로 이동하세요.</p></div></div><div class="grid two"><div class="card"><div class="tag">01 · ARCHIVE</div><h3>지난 수행평가 정리</h3><p class="muted tiny">학년·학기·과목별로 자료와 분석 메모를 관리합니다.</p><button class="btn ghost small" data-go="archive">아카이브 열기</button></div><div class="card"><div class="tag">02 · IDEAS</div><h3>새 주제 설계</h3><p class="muted tiny">과제 설명과 평가 기준을 바탕으로 탐구 아이디어를 생성합니다.</p><button class="btn ghost small" data-go="recommend">주제 추천 받기</button></div></div></div><aside class="side"><div class="card"><h3 style="margin:0 0 5px">나의 관심 진로</h3><p class="muted tiny">최대 5개까지 선택할 수 있습니다.</p>${(profile.goals||[]).length?(profile.goals||[]).map(g=>`<span class="tag">${esc(g.value)}</span>`).join(''):empty('설정에서 관심 분야를 선택해 주세요.')}<button class="btn outline small" style="margin-top:10px" data-action="profile">진로 설정</button><div class="divider"></div><h3 style="margin:0 0 5px">기록을 잘 활용하는 법</h3><p class="muted tiny">추천을 받을 때 과제 안내와 평가 기준을 함께 입력하면 조건에 맞는 아이디어를 비교하기 쉽습니다. 이전 수행평가와의 유사성도 꼭 확인하세요.</p></div></aside></div>`}
function renderArchive(){let grade=$('#filterGrade')?.value||'전체',sem=$('#filterSemester')?.value||'전체',sub=$('#filterSubject')?.value||'전체',type=$('#filterType')?.value||'전체';let list=state.records.filter(r=>(grade==='전체'||r.grade===grade)&&(sem==='전체'||r.semester===sem)&&(sub==='전체'||r.subject===sub)&&(type==='전체'||r.type===type));return `<div class="section-head"><div><h2>수행평가 아카이브</h2><p>한 번에 업로드하고, 학년·학기·과목별로 다시 찾아볼 수 있어요.</p></div><button class="btn" data-action="upload">＋ 자료 업로드</button></div><div class="notice">파일 자체는 이 브라우저의 로컬 저장소에 저장됩니다. PDF·한글·Word 파일의 본문을 자동으로 완벽하게 읽지는 못하므로, 파일 업로드 후 핵심 내용을 메모에 적어두면 추천 품질이 좋아집니다.</div><div class="filters"><select class="field" id="filterGrade"><option>전체</option><option>1학년</option><option>2학년</option><option>3학년</option></select><select class="field" id="filterSemester"><option>전체</option><option>1학기</option><option>2학기</option></select><select class="field" id="filterSubject"><option>전체</option>${allSubjects().map(s=>`<option>${esc(s)}</option>`).join('')}</select><select class="field" id="filterType"><option>전체</option><option>수행평가 파일</option><option>평가기준표</option></select></div><div id="archiveList">${list.length?list.slice().sort((a,b)=>b.createdAt-a.createdAt).map(recordCard).join(''):empty('조건에 맞는 자료가 없습니다. 자료 업로드 버튼으로 시작해 보세요.')}</div><div class="section-head"><div><h2>과목 관리</h2><p>학교에서 개설한 과목에 맞춰 과목을 추가할 수 있습니다.</p></div><button class="btn outline small" data-action="add-subject">＋ 과목 추가</button></div><div class="subject-grid">${Object.entries(state.subjects).flatMap(([g,sems])=>Object.entries(sems).flatMap(([s,subs])=>subs.map(sub=>`<div class="subject-chip"><span><b>${esc(sub)}</b><br><span class="muted">${g} · ${s}</span></span><button data-action="remove-subject" data-grade="${g}" data-sem="${s}" data-subject="${esc(sub)}" title="과목 삭제">−</button></div>`))).join('')}</div>`}
function renderRecommend(){return `<div class="section-head"><div><h2>세특 주제 추천</h2><p>과제 조건과 기존 기록을 함께 검토해, 연결성 있는 탐구 출발점을 제안합니다.</p></div></div><div class="grid two"><section class="card"><div class="form-item"><label class="label">과제 과목</label><select class="field" id="recSubject">${allSubjects().map(s=>`<option>${esc(s)}</option>`).join('')}<option value="직접 입력">직접 입력</option></select><input class="field hidden" id="recSubjectCustom" placeholder="과목명 입력" style="margin-top:8px"></div><div class="form-row"><div class="form-item"><label class="label">학년</label><select class="field" id="recGrade"><option>1학년</option><option>2학년</option><option>3학년</option></select></div><div class="form-item"><label class="label">학기</label><select class="field" id="recSemester"><option>1학기</option><option>2학기</option></select></div></div><div class="form-item"><label class="label">수행평가 안내 / 과제 설명</label><textarea class="field" id="recTask" rows="4" placeholder="예: 교과 개념을 활용해 사회 문제를 분석하고 해결 방안을 제시하는 보고서"></textarea></div><div class="form-item"><label class="label">평가 기준표 / 꼭 지켜야 할 조건</label><textarea class="field" id="recRubric" rows="3" placeholder="예: 교과 개념 정확성, 자료 출처 3개 이상, 자신의 분석, 실현 가능한 대안"></textarea></div><div class="form-item"><label class="label">내가 더 탐구하고 싶은 방향 (선택)</label><textarea class="field" id="recInterest" rows="2" placeholder="예: 의료 접근성, 데이터 분석, 청소년 미디어 이용 등"></textarea></div><button class="btn" id="generateBtn" style="width:100%">기존 기록과 연결해 주제 3개 추천</button><p class="tiny muted">추천은 진로·저장 기록·입력한 과제 조건을 바탕으로 브라우저에서 생성되는 초안입니다. 외부 AI 서버에 연결되어 있지 않으므로 실제 AI의 문서 이해나 최신 정보 검증을 대신하지 않습니다.</p></section><section class="card"><h3 style="margin:0 0 5px">추천에 반영되는 정보</h3><p class="muted tiny">기록을 바탕으로 아이디어가 어떻게 연결되는지 확인하세요.</p><div class="mini-heading">나의 관심 진로</div>${(state.profile?.goals||[]).length?(state.profile.goals||[]).map(g=>`<span class="tag">${esc(g.value)}</span>`).join(''):empty('설정에서 관심 진로를 선택해 주세요.')}<div class="mini-heading">이전 수행평가에서 찾은 키워드</div>${state.records.filter(r=>r.type==='수행평가 파일').length?state.records.filter(r=>r.type==='수행평가 파일').slice(-6).reverse().map(r=>`<div class="item"><b style="font-size:13px">${esc(r.title)}</b><div class="tiny muted">${esc(r.grade)} · ${esc(r.semester)} · ${esc(r.subject)}</div><p>${esc(r.summary||r.notes||'요약 메모 없음')}</p></div>`).join(''):empty('자료를 저장하면 기존 탐구를 연결하는 데 도움이 됩니다.')}<div class="notice">좋은 세특은 진로 단어를 억지로 붙이는 것이 아니라, 수업 개념을 정확히 사용하고 질문을 구체화하며 자료를 비교·해석한 과정이 드러나는 데서 출발합니다.</div></section></div><div class="section-head"><div><h2>추천 결과</h2><p>마음에 드는 주제를 선택한 뒤, 실제 과제 조건에 맞게 다듬어 보세요.</p></div><button class="btn outline small" id="moreBtn">다른 주제 더 보기</button></div><div id="recommendResults">${lastRecommendations.length?renderRecItems(lastRecommendations):empty('과목과 과제 안내를 입력한 뒤 추천 버튼을 눌러 주세요.')}</div>`}
function renderRecItems(items){return items.map((r,i)=>`<div class="card" style="margin-bottom:12px"><div class="item-top"><div><div class="tag">주제 ${i+1}</div><h3 style="margin:7px 0 4px">${esc(r.title)}</h3></div><button class="btn outline small" data-action="copy-topic" data-index="${i}">주제 복사</button></div><p class="muted tiny">${esc(r.question)}</p><div class="mini-heading">탐구 설계</div><p class="tiny">${esc(r.plan)}</p><div class="mini-heading">진로·기존 기록과의 연결</div><p class="tiny">${esc(r.link)}</p><div class="mini-heading">평가 기준 반영 체크</div><p class="tiny">${esc(r.rubric)}</p><div class="item-actions"><button class="btn ghost small" data-action="save-topic" data-index="${i}">아카이브에 아이디어 저장</button></div></div>`).join('')}
function renderActivities(){return `<div class="section-head"><div><h2>학생부 활동 추천</h2><p>교과 세특 외에도 자율·진로·행동특성 등에서 이어갈 수 있는 활동을 계획합니다.</p></div><button class="btn" data-action="new-activity">＋ 활동 추가</button></div><div class="notice">아래는 활동 설계 아이디어입니다. 학교의 실제 운영 범위와 담당 교사의 안내를 우선하고, 하지 않은 활동을 한 것처럼 기록하지 마세요.</div><div class="grid two"><div class="card"><h3 style="margin-top:0">활동 아이디어</h3>${activityIdeas().map((a,i)=>`<div class="recommendation"><div class="tag">${esc(a.area)}</div><h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p><div class="why">연계 포인트 · ${esc(a.link)}</div><button class="btn outline small" style="margin-top:9px" data-action="save-activity-idea" data-index="${i}">내 계획에 추가</button></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">내 활동 계획</h3>${state.activities.length?state.activities.map(a=>`<div class="item"><div class="item-top"><div><div class="tag">${esc(a.area)}</div><h3>${esc(a.title)}</h3></div><button class="btn danger small" data-action="delete-activity" data-id="${a.id}">삭제</button></div><p>${esc(a.desc||'')}</p><div class="tiny muted" style="margin-top:8px">상태: ${esc(a.status||'아이디어')}</div><select class="field" style="margin-top:9px" data-action="activity-status" data-id="${a.id}"><option ${a.status==='아이디어'?'selected':''}>아이디어</option><option ${a.status==='진행 중'?'selected':''}>진행 중</option><option ${a.status==='완료'?'selected':''}>완료</option></select></div>`).join(''):empty('아직 추가한 활동 계획이 없습니다. 왼쪽 아이디어에서 골라 보세요.')}</div></div>`}
function activityIdeas(){let g=(state.profile?.goals||[]).map(x=>x.value).join(', ')||'관심 분야';return [
{area:'진로활동',title:'관심 분야 질문 지도 만들기',desc:`${g}와 관련해 평소 궁금한 질문을 5개 적고, 질문마다 필요한 교과 개념과 조사 자료를 연결합니다.`,link:'수행평가에서 시작된 질문을 장기 탐구로 발전'},
{area:'자율활동',title:'학교 안의 작은 문제를 관찰하고 개선안 제안',desc:'학교생활에서 실제로 관찰 가능한 불편이나 정보 격차를 정하고, 익명 설문·관찰 기록을 바탕으로 개선안을 제안합니다.',link:'자료 수집·협업·실행 과정 기록'},
{area:'행동특성',title:'협업 과정의 역할과 피드백 기록',desc:'모둠 활동에서 맡은 역할, 어려웠던 점, 받은 피드백, 다음에 바꿀 행동을 짧게 기록합니다. 성격을 꾸미기보다 실제 행동 근거를 남깁니다.',link:'구체적인 행동과 성장 과정'},
{area:'진로활동',title:'전공 관점으로 같은 문제 다시 읽기',desc:'이전 수행평가 주제를 관심 분야의 관점으로 다시 해석하고, 관점이 달라지며 새롭게 보인 점과 한계를 정리합니다.',link:'학년·과목 사이 탐구의 연속성'},
{area:'자율활동',title:'근거 중심의 미니 정보 안내물 제작',desc:'관심 주제에 대해 신뢰할 수 있는 자료를 3개 이상 비교하고, 출처와 핵심 근거를 표시한 한 장짜리 안내물을 제작합니다.',link:'정보 검증·의사소통·사회 기여'}
]}
function renderSettings(){let p=state.profile||{name:'',userId:'',track:'미정',goals:[]};return `<div class="section-head"><div><h2>설정</h2><p>프로필과 진로 관심사, 과목 목록을 관리합니다.</p></div></div><div class="grid two"><div class="card"><h3 style="margin-top:0">프로필</h3><div class="form-item"><label class="label">이름</label><input class="field" id="settingsName" value="${esc(p.name)}"></div><div class="form-item"><label class="label">아이디</label><input class="field" id="settingsId" value="${esc(p.userId)}"></div><button class="btn" id="saveProfileBtn">프로필 저장</button><div class="notice">이름과 아이디는 이 브라우저에서 프로필을 구분하는 용도입니다. 서버 계정 인증 기능은 아니며, 다른 기기나 브라우저로 자동 동기화되지 않습니다.</div></div><div class="card"><h3 style="margin-top:0">관심 진로 설정</h3><p class="muted tiny">문과·이과·미정 중 탐색 방식을 선택하고 분야·학과·직업을 합쳐 최대 5개까지 등록하세요.</p><div class="choice-row">${['문과','이과','미정'].map(t=>`<button class="choice ${p.track===t?'selected':''}" data-action="set-track" data-track="${t}">${t==='미정'?'아직 못 정했어요':t}</button>`).join('')}</div><div class="form-item" style="margin-top:13px"><label class="label">통합 검색</label><input class="field" id="goalSearch" placeholder="분야, 학과, 직업 검색"></div><div class="choice-row" id="goalTypeChoices"><button class="choice selected" data-action="goal-type" data-type="전체">전체</button><button class="choice" data-action="goal-type" data-type="분야">분야</button><button class="choice" data-action="goal-type" data-type="학과">학과</button><button class="choice" data-action="goal-type" data-type="직업">직업</button></div><div id="goalResults" style="margin-top:10px"></div><div class="mini-heading">선택한 관심사 (${(p.goals||[]).length}/5)</div><div>${(p.goals||[]).map((g,i)=>`<span class="goal-pill">${esc(g.type)} · ${esc(g.value)} <button data-action="remove-goal" data-index="${i}">×</button></span>`).join('')||'<span class="muted tiny">아직 선택한 항목이 없습니다.</span>'}</div></div></div><div class="section-head"><div><h2>데이터 백업</h2><p>기록을 다른 브라우저로 옮기려면 백업 파일을 내려받아 복원하세요.</p></div></div><div class="card"><div class="inline" style="flex-wrap:wrap"><button class="btn" data-action="export">백업 파일 다운로드</button><button class="btn outline" data-action="import">백업 파일 복원</button><button class="btn danger" data-action="reset">이 브라우저 데이터 초기화</button></div><p class="tiny muted">백업 파일에는 프로필, 관심사, 기록 메모가 포함될 수 있으니 안전한 곳에 보관하세요. 파일 원본은 백업 JSON에 포함하지 않습니다.</p></div>`}
function render(){const v=$('#view');if(currentTab==='home')v.innerHTML=renderHome();if(currentTab==='archive')v.innerHTML=renderArchive();if(currentTab==='recommend')v.innerHTML=renderRecommend();if(currentTab==='activities')v.innerHTML=renderActivities();if(currentTab==='settings')v.innerHTML=renderSettings();if(currentTab==='settings')renderGoalResults();$('#userButton').textContent=state.profile?.name?state.profile.name+' · 프로필':'프로필 설정'}

function profileModal(){let p=state.profile||{name:'',userId:'',track:'미정',goals:[]};showModal(`<div class="close-row"><h2>프로필 시작하기</h2><button class="btn outline small" data-action="close-modal">닫기</button></div><p class="sub">이름과 아이디를 설정하고 관심 진로를 선택하세요. 이 사이트는 현재 브라우저 안에서 데이터를 저장합니다.</p><div class="form-item"><label class="label">이름</label><input class="field" id="modalName" value="${esc(p.name)}" placeholder="이름"></div><div class="form-item"><label class="label">아이디</label><input class="field" id="modalId" value="${esc(p.userId)}" placeholder="나만 알아볼 아이디"></div><div class="divider"></div><div class="form-item"><label class="label">진로 탐색 방식</label><div class="choice-row">${['문과','이과','미정'].map(t=>`<button class="choice ${p.track===t?'selected':''}" data-action="modal-track" data-track="${t}">${t}</button>`).join('')}</div></div><p class="tiny muted">세부 분야·학과·직업은 설정 탭에서 최대 5개까지 추가할 수 있어요.</p><button class="btn" style="width:100%" data-action="save-modal-profile">저장하고 시작하기</button>`)}
function uploadModal(){showModal(`<div class="close-row"><h2>자료 업로드</h2><button class="btn outline small" data-action="close-modal">닫기</button></div><p class="sub">파일 하나를 고른 뒤 어떤 자료인지 분류하고 학년·학기·과목을 지정합니다.</p><div class="form-item"><label class="label">파일 선택</label><input class="field" type="file" id="modalFiles" multiple accept=".pdf,.doc,.docx,.hwp,.hwpx,.txt,.md,.csv,.ppt,.pptx,.jpg,.jpeg,.png"></div><div class="form-row"><div class="form-item"><label class="label">자료 종류</label><select class="field" id="upType"><option>수행평가 파일</option><option>평가기준표</option></select></div><div class="form-item"><label class="label">학년</label><select class="field" id="upGrade"><option>1학년</option><option>2학년</option><option>3학년</option></select></div></div><div class="form-row"><div class="form-item"><label class="label">학기</label><select class="field" id="upSem"><option>1학기</option><option>2학기</option></select></div><div class="form-item"><label class="label">과목</label><select class="field" id="upSubject">${allSubjects().map(s=>`<option>${esc(s)}</option>`).join('')}<option value="직접 입력">직접 입력</option></select><input class="field hidden" id="upSubjectCustom" placeholder="과목명 입력" style="margin-top:7px"></div></div><div class="form-item"><label class="label">수행평가 제목 (분석 후 수정 가능)</label><input class="field" id="upTitle" placeholder="예: 지역 불평등 자료 분석 보고서"></div><div class="form-item"><label class="label">핵심 내용 / 한두 문장 요약</label><textarea class="field" id="upNotes" rows="3" placeholder="파일에서 다룬 질문, 사용한 교과 개념, 결론 등을 적어 주세요."></textarea></div><div class="notice">선택한 파일은 이 브라우저에만 저장됩니다. 용량이 큰 파일은 저장 한도에 걸릴 수 있습니다. 업로드한 파일을 자동으로 읽어 요약하는 AI 기능은 아직 연결되어 있지 않습니다.</div><button class="btn" style="width:100%" data-action="save-upload">자료 저장</button>`)}
function renderGoalResults(){const el=$('#goalResults');if(!el)return;let query=$('#goalSearch')?.value.toLowerCase()||'',type=$('#goalTypeChoices .selected')?.dataset.type||'전체',track=state.profile?.track||'미정';let items=[];if(type==='전체'||type==='분야')items.push(...(fields[track]||fields['미정']).map(value=>({type:'분야',value})));if(type==='전체'||type==='학과')items.push(...majors.map(value=>({type:'학과',value})));if(type==='전체'||type==='직업')items.push(...jobs.map(value=>({type:'직업',value})));items=items.filter(x=>x.value.toLowerCase().includes(query)&&!(state.profile?.goals||[]).some(g=>g.value===x.value)).slice(0,22);el.innerHTML=items.length?items.map(x=>`<button class="choice" style="margin:3px" data-action="add-goal" data-type="${x.type}" data-value="${esc(x.value)}">＋ ${esc(x.value)} <span class="muted">· ${x.type}</span></button>`).join(''):empty('검색 결과가 없거나 이미 선택한 항목입니다.')}
function generateTopics(more=false){let subject=$('#recSubject')?.value||'공통국어1';if(subject==='직접 입력')subject=$('#recSubjectCustom')?.value.trim()||'선택 과목';let grade=$('#recGrade')?.value||'1학년',semester=$('#recSemester')?.value||'1학기',task=$('#recTask')?.value.trim()||'교과 개념을 활용해 자료를 분석하고 자신의 관점을 제시하는 수행평가',rubric=$('#recRubric')?.value.trim()||'교과 개념의 정확성, 자료 근거, 논리적 분석, 독창성, 표현의 명료성',interest=$('#recInterest')?.value.trim()||'',goals=(state.profile?.goals||[]).map(x=>x.value),past=state.records.filter(r=>r.type==='수행평가 파일'),recent=past.slice(-5).map(r=>r.title+' ('+r.subject+')'),prior=recent.join(' / ')||'아직 저장된 수행평가가 없음';let lens=[['비교·분석형','서로 다른 자료나 사례를 비교해 공통점과 차이를 찾아내고, 차이가 생긴 이유를 교과 개념으로 설명합니다.'],['지역·생활 적용형','교과 개념을 학교·지역사회·일상에서 관찰할 수 있는 사례에 적용하고, 해결 방향을 근거와 함께 제안합니다.'],['데이터·검증형','공개 자료나 직접 수집 가능한 관찰 자료를 기준에 따라 분류하고, 수치·주장의 한계까지 함께 해석합니다.'],['관점 전환형','같은 현상을 다른 이해관계자나 학문 분야의 관점에서 분석해 기존 설명의 빈틈과 보완점을 찾습니다.'],['설계·실험형','변인을 명확히 정한 소규모 조사·모형·실험을 설계하고, 결과가 예상과 다를 때 가능한 원인을 검토합니다.'],['정책·윤리형','문제의 원인과 영향을 받는 집단을 구분하고, 효과·비용·공정성 기준으로 대안을 비교합니다.']];let offset=more?3:0;let topics=[];for(let i=0;i<3;i++){let [kind,desc]=lens[(offset+i)%lens.length];let angle=interest?interest:(goals[(offset+i)%Math.max(goals.length,1)]||'관심 사회·과학 현상');let pastPick=recent.length?recent[(offset+i)%recent.length]:'기존 기록이 쌓이면 그 주제와의 차별점을 추가로 검토';let titles=[`${angle}을/를 중심으로 ${subject}의 핵심 개념이 실제 사례에서 작동하는 방식 분석`,`서로 다른 자료로 살펴보는 ${angle}의 원인과 한계: ${subject} 개념을 활용한 비교 탐구`,`${angle} 관련 문제의 대안 비교: 효과와 공정성을 기준으로 한 ${subject} 기반 제안`];let title=titles[i];if(!interest&&goals.length)title=`${goals[(offset+i)%goals.length]}와 연결해 탐구하는 ${subject}의 ${kind.replace('형','')} 주제`;topics.push({title,question:`${angle}와 관련해 ${subject}에서 배운 개념은 현상을 얼마나 설명할 수 있으며, 설명하지 못하는 부분은 무엇인가?`,plan:`1. 과제 안내에서 요구하는 교과 개념을 2~3개로 좁힙니다.\n2. 신뢰할 수 있는 자료를 최소 2~3개 확보하고 출처·기준을 기록합니다.\n3. ${desc}\n4. 결론에서 근거, 한계, 추가로 확인할 질문을 구분합니다.`,link:`관심 진로(${goals.join(', ')||'아직 설정되지 않음'})의 관점과 연결하되, 진로를 제목에 억지로 붙이지 않습니다. 이전 기록: ${pastPick}. 이전 주제와 겹친다면 사례·자료·질문 중 하나를 바꿔 차별화하세요.`,rubric:`입력한 기준 반영: ${rubric}\n제출 전 점검: 교과 개념 정확성 / 자료 출처 표기 / 자신의 해석 / 과제 분량·형식 준수`})}lastRecommendations=topics;$('#recommendResults').innerHTML=renderRecItems(topics);state.recommendHistory.unshift({subject,grade,semester,task,rubric,topics,createdAt:Date.now()});state.recommendHistory=state.recommendHistory.slice(0,20);save()}
function handleAction(action,el){let i=Number(el.dataset.index),rid=Number(el.dataset.id);

if(action==='remove-subject'){let g=el.dataset.grade,s=el.dataset.sem,n=el.dataset.subject;if(confirm(`${g} ${s}의 과목 '${n}'을 목록에서 삭제할까요? 기존 자료 기록은 유지됩니다.`)){state.subjects[g][s]=state.subjects[g][s].filter(x=>x!==n);save();render()}}

if(action==='edit-record'){let r=state.records.find(x=>x.id===rid);if(!r)return;showModal(`<div class="close-row"><h2>자료 정보 수정</h2><button class="btn outline small" data-action="close-modal">닫기</button></div><div class="form-item"><label class="label">수행평가 제목</label><input class="field" id="editTitle" value="${esc(r.title)}"></div><div class="form-item"><label class="label">한두 문장 요약</label><textarea class="field" id="editSummary" rows="3">${esc(r.summary||'')}</textarea></div><div class="form-item"><label class="label">추가 메모</label><textarea class="field" id="editNotes" rows="3">${esc(r.notes||'')}</textarea></div><button class="btn" style="width:100%" data-action="save-edit-record" data-id="${rid}">저장</button>`)}

if(action==='export'){let data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='seuteukitda-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
if(action==='import'){$('#importPicker')?.remove();let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let f=inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!d||!Array.isArray(d.records))throw Error();if(confirm('현재 기록을 백업 파일의 데이터로 교체할까요?')){state=d;save();render();alert('복원했습니다.')}}catch(e){alert('올바른 세특잇다 백업 파일이 아닙니다.')} };rd.readAsText(f)};inp.click()}

if(action==='copy-topic'){let r=lastRecommendations[i];if(r){let txt=`${r.title}\n탐구 질문: ${r.question}\n탐구 설계: ${r.plan}\n연계: ${r.link}\n평가 기준: ${r.rubric}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('주제를 복사했습니다.')).catch(()=>prompt('아래 내용을 복사해 주세요.',txt));else prompt('아래 내용을 복사해 주세요.',txt)}}
}
function makeSummary(fileName,notes){let ext=(fileName.split('.').pop()||'').toLowerCase();if(notes.trim())return notes.trim().split(/\n/).join(' ').slice(0,500);let name=fileName.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');return `파일명에서 추정한 제목: '${name}'. ${['txt','md','csv'].includes(ext)?'텍스트 파일의 핵심 내용을 확인해 요약 메모를 보완하세요.':'파일 본문 자동 분석은 아직 연결되지 않았습니다. 자료를 열어 주제·사용한 교과 개념·결론을 한두 문장으로 기록해 주세요.'}`}
function wireFilters(){['filterGrade','filterSemester','filterSubject','filterType'].forEach(id=>$('#'+id)?.addEventListener('change',()=>{let vals={grade:$('#filterGrade').value,semester:$('#filterSemester').value,subject:$('#filterSubject').value,type:$('#filterType').value};let list=state.records.filter(r=>(vals.grade==='전체'||r.grade===vals.grade)&&(vals.semester==='전체'||r.semester===vals.semester)&&(vals.subject==='전체'||r.subject===vals.subject)&&(vals.type==='전체'||r.type===vals.type));$('#archiveList').innerHTML=list.length?list.slice().sort((a,b)=>b.createdAt-a.createdAt).map(recordCard).join(''):empty('조건에 맞는 자료가 없습니다.') }))}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){go(tab.dataset.tab);return}let goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}let act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act);return}});
document.addEventListener('change',e=>{if(e.target.id==='recSubject')$('#recSubjectCustom')?.classList.toggle('hidden',e.target.value!=='직접 입력');if(e.target.id==='upSubject')$('#upSubjectCustom')?.classList.toggle('hidden',e.target.value!=='직접 입력');if(e.target.dataset.action==='activity-status'){let a=state.activities.find(x=>x.id===Number(e.target.dataset.id));if(a){a.status=e.target.value;save()}}});
document.addEventListener('input',e=>{if(e.target.id==='goalSearch')renderGoalResults()});
document.addEventListener('click',e=>{if(e.target.id==='generateBtn'){generateTopics(false)}if(e.target.id==='moreBtn'){generateTopics(true)}if(e.target.id==='saveProfileBtn'){if(!state.profile)state.profile={track:'미정',goals:[]};state.profile.name=$('#settingsName').value.trim();state.profile.userId=$('#settingsId').value.trim();save();render();alert('프로필을 저장했습니다.')}});
$('#userButton').addEventListener('click',profileModal);
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
render();wireFilters();
if(!state.profile||!state.profile.name||!state.profile.userId){profileModal()}else{$('#heroTitle').innerHTML=`${esc(state.profile.name)}님의 수행평가를 모으고,<br>배움의 흐름을 연결하세요.`}
})();
</script>
</body>
</html>
